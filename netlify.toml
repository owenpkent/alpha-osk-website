# Netlify configuration for alphaosk.com
# https://docs.netlify.com/configure-builds/file-based-configuration/
#
# Static site, no build step: the repo root is what gets served. Modelled on
# reflex-website/netlify.toml, minus the pieces that site has and this one does
# not (serverless functions, a docs/ tree to keep private, GA4).

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # HSTS with preload: safe here because there are no subdomains that will
    # ever need to serve plain HTTP.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    # Enforced rather than report-only, because every source is accounted for
    # and there is no third-party script on this site at all:
    #   - 'unsafe-inline' in script-src is for the no-flash theme script in the
    #     <head>, which has to run before first paint and so cannot be deferred
    #     to an external file.
    #   - 'unsafe-inline' in style-src is for the handful of style attributes in
    #     the markup.
    #   - api.github.com in connect-src is the release lookup in
    #     scripts/alphaosk.js, which supplies both the version labels and the
    #     per-file download URLs. Remove that and the labels fall back to their
    #     static text and the buttons to the releases page; nothing breaks, the
    #     download just costs a second page again.
    #   - raw.githubusercontent.com in connect-src is the published usage
    #     aggregate behind the two hero figures, also in scripts/alphaosk.js.
    #     Remove it and the hero falls back to the numbers baked into the
    #     markup, which is a stale headline rather than a broken one.
    # If a third-party script is ever added, add its origin here in the same
    # commit as the tag, not afterwards.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.github.com https://raw.githubusercontent.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'"

# Images keep stable filenames and get their contents replaced in place, so a
# long immutable entry would pin returning visitors to superseded screenshots.
# A day, then revalidate.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# Nothing here is content-hashed: styles/alphaosk.css and scripts/alphaosk.js
# keep their names across every edit, so an immutable entry would pair new HTML
# with an old stylesheet and no ordinary reload could fix it. Revalidate and let
# ETags return 304s. The ?v= stamps on the tags are belt and braces for a
# cutover you want instant; routine edits do not need them.
#
# Extension patterns rather than /styles/* and /scripts/*, so CSS or JS added
# outside those two directories is covered too.
[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Serve the study page at an extensionless /study, and make that the only
# URL for it. Netlify will usually resolve /study to study.html on its own,
# but this URL is baked into a shipped Windows installer page and into the
# printed consent form, where it cannot be corrected after the fact, so it
# is pinned here rather than left to a platform default. The .html path
# redirects rather than serving a duplicate, so the two spellings cannot
# split ranking signals or produce two canonical URLs for one page.
#
# The first rule is deliberately unforced: nothing exists at /study, so there
# is no file for Netlify to prefer over it. The second has to be forced,
# because study.html is a real file and would otherwise be served as itself.
[[redirects]]
  from = "/study"
  to = "/study.html"
  status = 200

[[redirects]]
  from = "/study.html"
  to = "/study"
  status = 301
  force = true

# The form's success page is deliberately NOT routed here, and that is
# load-bearing rather than an omission. A form's action has to resolve to a
# real file in the published tree: Netlify's form handler looks the success
# page up there, not through the redirect engine, so an action pointing at a
# rewrite silently falls back to Netlify's own generic "Thank you!" page.
# study-thanks.html is a real file, and Netlify serves it at /study-thanks
# without any rule needing to say so.

# Repo bookkeeping must not be served. Netlify publishes the repo root, so
# without this README.md is fetchable on the live domain.
#
# force = true is load-bearing: Netlify serves an existing file in preference to
# a matching redirect, so an unforced rule over a real file does nothing at all.
# Every rule here targets a real file, so every one has to be forced.
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

# Canonicalisation: force the apex so ranking signals do not split across hosts.
# Belt and braces alongside setting alphaosk.com as the Primary domain in
# Netlify's Domain management with automatic redirect to primary turned on.
[[redirects]]
  from = "https://www.alphaosk.com/*"
  to = "https://alphaosk.com/:splat"
  status = 301
  force = true
